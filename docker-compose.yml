services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: brewidea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: brewidea
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Publicado solo en localhost del VPS (para migraciones/seed desde el host).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewidea -d brewidea"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - web

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Ruta (dentro del contenedor) al allowlist de modelos del agente brew.
      BREW_MODELS_PATH: /brew-models.json
    volumes:
      # Allowlist de modelos del agente brew, montado en solo lectura. Es la
      # fuente autoritativa de modelos usables y su capacidad de razonamiento.
      - /root/.openclaw/agents/brew/agent/models.json:/brew-models.json:ro
    depends_on:
      db:
        condition: service_healthy
    # Permite que el contenedor alcance el bridge que corre en el host
    # (BRIDGE_API_URL=http://host.docker.internal:9090).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Publicado SOLO en localhost del VPS. El tráfico de internet entra por el
    # Caddy NATIVO del host (no por Docker), que hace de reverse proxy a :3000.
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - web

networks:
  web:

volumes:
  pgdata:
